<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>呼吸養樹 · Breath Tree</title>
    <style>
        /* ===== 全域 & 字體 ===== */
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1a1a 0%, #1a2f2a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang TC', system-ui, sans-serif;
            padding: 16px;
        }
        .game-wrapper {
            max-width: 800px;
            width: 100%;
            background: rgba(30, 50, 45, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 56px;
            padding: 28px 24px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px #5a7a6a inset;
            transition: 0.3s;
        }

        /* ===== 標題列 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d4e8d0;
            padding: 0 6px 12px 6px;
            border-bottom: 1px solid #3b5a4e;
            flex-wrap: wrap;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #c0e0b0, #f0e8b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stats {
            display: flex;
            gap: 24px;
            font-size: 0.95rem;
            background: #1f332e;
            padding: 6px 18px;
            border-radius: 60px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }
        .stats span {
            color: #b8d0c0;
        }
        .stats strong {
            color: #f5e79a;
            font-weight: 600;
        }

        /* ===== 樹的畫布 ===== */
        .tree-area {
            position: relative;
            margin: 18px 0 12px 0;
            background: radial-gradient(circle at 30% 80%, #1f3d30, #0f1f1a);
            border-radius: 120px 120px 60px 60px;
            padding: 20px 10px 10px 10px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.7);
            min-height: 360px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: 0.2s;
        }
        .tree-svg-container {
            width: 100%;
            max-height: 320px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        #treeSvg {
            width: 100%;
            max-width: 340px;
            height: auto;
            filter: drop-shadow(0 8px 12px rgba(0,20,10,0.6));
            transition: transform 0.2s;
        }

        /* ===== 休息覆蓋層 ===== */
        .rest-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 25, 20, 0.75);
            backdrop-filter: blur(3px);
            border-radius: 120px 120px 60px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #e6f0e0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .rest-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .rest-big {
            font-size: 4.2rem;
            font-weight: 800;
            letter-spacing: 10px;
            background: rgba(0,0,0,0.3);
            padding: 0 20px;
            border-radius: 80px;
            text-shadow: 0 0 20px #c0e0b0;
            color: #f0fae8;
        }
        .rest-countdown {
            font-size: 2.8rem;
            font-weight: 300;
            margin-top: 6px;
            background: rgba(0,0,0,0.25);
            padding: 0 30px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
        }
        .petal-fall {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.5;
            color: #f5eac0;
            animation: fall 8s infinite linear;
        }

        /* ===== 控制與狀態 ===== */
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin: 16px 0 8px 0;
        }
        .breath-indicator {
            background: #1d332c;
            padding: 6px 18px 6px 12px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #c0d8c8;
            font-weight: 500;
            box-shadow: inset 0 2px 6px #0a1410;
        }
        .meter-bar {
            width: 100px;
            height: 10px;
            background: #2d4a3e;
            border-radius: 20px;
            overflow: hidden;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b0e0b0, #f0e8a0);
            border-radius: 20px;
            transition: width 0.08s;
        }
        .key-hint {
            background: #273f38;
            padding: 6px 16px;
            border-radius: 80px;
            color: #c8e0d0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .key-hint kbd {
            background: #0c1c16;
            padding: 4px 10px;
            border-radius: 30px;
            color: #f5e79a;
            font-weight: 600;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: #2f4f42;
            border: none;
            padding: 8px 18px;
            border-radius: 60px;
            color: #e6f0e0;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 0 #1a2e26, inset 0 1px 2px #6a8a7a;
            transition: 0.08s linear;
        }
        .btn:active {
            transform: scale(0.94);
            box-shadow: 0 0 0 #1a2e26;
        }
        .btn-connect {
            background: #3d6a58;
            color: white;
        }
        .btn-reset {
            background: #5a3e3a;
        }

        .log-area {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #6a8a7a;
            background: #14231e;
            padding: 8px 14px;
            border-radius: 40px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            border: 1px solid #2d4a3a;
        }

        /* ===== 動畫 ===== */
        @keyframes fall {
            0% { transform: translateY(-30px) rotate(0deg); opacity: 0.6; }
            100% { transform: translateY(280px) rotate(40deg); opacity: 0; }
        }
        .grow-glow {
            animation: glowPulse 0.7s ease 2;
        }
        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 0 #b0e8a0); }
            50% { filter: drop-shadow(0 0 40px #d0f0b0) drop-shadow(0 0 80px #b0e8a0); }
            100% { filter: drop-shadow(0 0 0 #b0e8a0); }
        }
        .bloom {
            animation: bloomBurst 1s ease;
        }
        @keyframes bloomBurst {
            0% { transform: scale(1); filter: drop-shadow(0 0 0 #f5e79a); }
            40% { transform: scale(1.12); filter: drop-shadow(0 0 70px #f5e080); }
            100% { transform: scale(1); filter: drop-shadow(0 0 20px #f5e79a); }
        }

        /* ===== 上傳狀態指示 ===== */
        .sync-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: 8px;
            background: #4a6a5a;
            transition: 0.3s;
        }
        .sync-status.uploading {
            background: #f5e79a;
            box-shadow: 0 0 10px #f5e79a;
        }
        .sync-status.success {
            background: #7acf8a;
        }
        .sync-status.error {
            background: #cf7a7a;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- 標題 + 狀態 -->
    <div class="header">
        <div class="title">🌳 Breath Tree</div>
        <div class="stats">
            <span>🌱 階 <strong id="stageDisplay">0</strong></span>
            <span>🌸 訓練 <strong id="trainCountDisplay">0</strong></span>
            <span><span class="sync-status" id="syncStatus"></span></span>
        </div>
    </div>

    <!-- 樹區 -->
    <div class="tree-area" id="treeArea">
        <div class="tree-svg-container">
            <svg id="treeSvg" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
                <g id="treeGroup">
                    <rect id="trunk" x="88" y="160" width="24" height="90" fill="#6a4e3a" rx="6" />
                    <circle id="crown1" cx="100" cy="110" r="40" fill="#2d6a3a" />
                    <circle id="crown2" cx="70" cy="140" r="32" fill="#2a7a3a" />
                    <circle id="crown3" cx="130" cy="140" r="32" fill="#2a7a3a" />
                    <circle id="crown4" cx="100" cy="70" r="36" fill="#3a8a4a" />
                    <circle id="crown5" cx="70" cy="100" r="28" fill="#3a8a4a" />
                    <circle id="crown6" cx="130" cy="100" r="28" fill="#3a8a4a" />
                    <g id="flowerGroup" opacity="0">
                        <circle cx="70" cy="80" r="8" fill="#f5d0b0" />
                        <circle cx="130" cy="80" r="8" fill="#f5d0b0" />
                        <circle cx="100" cy="50" r="10" fill="#f5d0b0" />
                        <circle cx="50" cy="110" r="7" fill="#f5d0b0" />
                        <circle cx="150" cy="110" r="7" fill="#f5d0b0" />
                    </g>
                </g>
            </svg>
        </div>

        <!-- 休息覆蓋層 -->
        <div class="rest-overlay" id="restOverlay">
            <div class="rest-big">休 息</div>
            <div class="rest-countdown" id="restCountdown">3</div>
        </div>
    </div>

    <!-- 控制列 -->
    <div class="control-panel">
        <div class="breath-indicator">
            <span>💨 氣流</span>
            <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
            <span id="breathValue">0</span>
        </div>
        <div class="key-hint">
            <kbd>↓</kbd> 按住吐氣 (越久越強)
        </div>
        <div class="btn-group">
            <button class="btn btn-connect" id="connectBtn">🔌 連線 ESP32</button>
            <button class="btn btn-reset" id="resetTreeBtn">🌱 重置樹</button>
        </div>
    </div>

    <!-- 日誌 -->
    <div class="log-area" id="logArea">🌿 系統就緒 · 按住 ↓ 或接上 ESP32 開始吐氣</div>
</div>

<script>
    (function() {
        // ==================== 核心狀態 ====================
        const STATE = {
            stage: 0,
            maxStage: 8,
            trainingCount: 0,
            isResting: false,
            restSeconds: 3,
            restTimer: null,
            isGrowing: false,
            growTimer: null,
            breathValue: 0,
            threshold: 45,
            keyPressed: false,
            keyStartTime: 0,
            port: null,
            reader: null,
            serialConnected: false,
            sessionId: null,
            syncQueue: [],
            isSyncing: false,
        };

        // ==================== 後端 API 配置 ====================
        // 在 Vercel 部署時，這個路徑會對應到 /api/log 的 Serverless Function
        const API_URL = '/api/log';

        // ==================== 日誌上傳 ====================
        async function uploadLog(eventType, data) {
            if (!STATE.sessionId) {
                STATE.sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            }

            const payload = {
                sessionId: STATE.sessionId,
                timestamp: new Date().toISOString(),
                eventType: eventType,
                data: {
                    ...data,
                    stage: STATE.stage,
                    trainingCount: STATE.trainingCount,
                    breathValue: STATE.breathValue,
                }
            };

            // 加入佇列
            STATE.syncQueue.push(payload);
            
            // 如果沒有正在同步，立即處理
            if (!STATE.isSyncing) {
                processSyncQueue();
            }
        }

        async function processSyncQueue() {
            if (STATE.syncQueue.length === 0) {
                STATE.isSyncing = false;
                return;
            }

            STATE.isSyncing = true;
            const payload = STATE.syncQueue[0];
            
            try {
                updateSyncStatus('uploading');
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                console.log('[Sync] 上傳成功:', result);
                
                // 上傳成功，從佇列移除
                STATE.syncQueue.shift();
                updateSyncStatus('success');
                
                // 繼續處理下一個
                setTimeout(() => processSyncQueue(), 100);
                
            } catch (error) {
                console.error('[Sync] 上傳失敗:', error);
                updateSyncStatus('error');
                
                // 保留在佇列中，稍後重試
                // 5秒後重試
                setTimeout(() => {
                    STATE.isSyncing = false;
                    processSyncQueue();
                }, 5000);
            }
        }

        function updateSyncStatus(status) {
            const indicator = document.getElementById('syncStatus');
            indicator.className = 'sync-status';
            if (status === 'uploading') {
                indicator.classList.add('uploading');
            } else if (status === 'success') {
                indicator.classList.add('success');
                setTimeout(() => {
                    indicator.className = 'sync-status';
                }, 2000);
            } else if (status === 'error') {
                indicator.classList.add('error');
                setTimeout(() => {
                    indicator.className = 'sync-status';
                }, 3000);
            }
        }

        // ==================== 記錄各種事件 ====================
        function logEvent(eventType, extraData = {}) {
            uploadLog(eventType, extraData);
        }

        // ==================== DOM 參考 ====================
        const $ = id => document.getElementById(id);
        const treeSvg = $('treeSvg');
        const trunk = $('trunk');
        const crown1 = $('crown1');
        const crown2 = $('crown2');
        const crown3 = $('crown3');
        const crown4 = $('crown4');
        const crown5 = $('crown5');
        const crown6 = $('crown6');
        const flowerGroup = $('flowerGroup');
        const stageDisplay = $('stageDisplay');
        const trainCountDisplay = $('trainCountDisplay');
        const meterFill = $('meterFill');
        const breathValue = $('breathValue');
        const logArea = $('logArea');
        const restOverlay = $('restOverlay');
        const restCountdown = $('restCountdown');
        const treeArea = $('treeArea');
        const connectBtn = $('connectBtn');
        const resetTreeBtn = $('resetTreeBtn');

        // ==================== 輔助 ====================
        function log(msg) {
            logArea.textContent = '🌱 ' + msg;
            console.log('[BreathTree]', msg);
        }

        // 更新樹的外觀
        function updateTree() {
            const s = Math.min(STATE.stage, STATE.maxStage);
            const ratio = s / STATE.maxStage;

            const trunkH = 90 + ratio * 50;
            trunk.setAttribute('height', trunkH);
            trunk.setAttribute('y', 260 - trunkH - 20);

            const r1 = Math.round(40 * (0.7 + ratio * 0.5));
            const r2 = Math.round(32 * (0.7 + ratio * 0.5));
            const r3 = Math.round(32 * (0.7 + ratio * 0.5));
            const r4 = Math.round(36 * (0.7 + ratio * 0.6));
            const r5 = Math.round(28 * (0.7 + ratio * 0.5));
            const r6 = Math.round(28 * (0.7 + ratio * 0.5));

            crown1.setAttribute('r', r1);
            crown2.setAttribute('r', r2);
            crown3.setAttribute('r', r3);
            crown4.setAttribute('r', r4);
            crown5.setAttribute('r', r5);
            crown6.setAttribute('r', r6);

            const offsetY = -ratio * 18;
            crown1.setAttribute('cy', 110 + offsetY);
            crown2.setAttribute('cy', 140 + offsetY);
            crown3.setAttribute('cy', 140 + offsetY);
            crown4.setAttribute('cy', 70 + offsetY);
            crown5.setAttribute('cy', 100 + offsetY);
            crown6.setAttribute('cy', 100 + offsetY);

            const bloom = (STATE.stage >= STATE.maxStage);
            flowerGroup.setAttribute('opacity', bloom ? '1' : '0');
            if (bloom) {
                flowerGroup.setAttribute('class', 'bloom');
                document.querySelectorAll('#flowerGroup circle').forEach(c => {
                    c.setAttribute('fill', '#f5c8a0');
                });
            } else {
                flowerGroup.setAttribute('class', '');
            }

            stageDisplay.textContent = STATE.stage;
            trainCountDisplay.textContent = STATE.trainingCount;
        }

        // 播放長大動畫
        function playGrowAnimation() {
            if (STATE.isGrowing) return;
            STATE.isGrowing = true;
            treeSvg.classList.add('grow-glow');
            log('🌿 長大！');
            
            // 記錄長大事件
            logEvent('grow', { 
                newStage: STATE.stage,
                totalTraining: STATE.trainingCount 
            });

            setTimeout(() => {
                treeSvg.classList.remove('grow-glow');
                STATE.isGrowing = false;
                if (STATE.stage >= STATE.maxStage) {
                    log('🌸 開花！ 訓練次數：' + STATE.trainingCount);
                    treeSvg.classList.add('bloom');
                    
                    // 記錄開花事件
                    logEvent('bloom', { 
                        totalTraining: STATE.trainingCount 
                    });
                    
                    setTimeout(() => treeSvg.classList.remove('bloom'), 1200);
                }
                saveToLocal();
            }, 700);
        }

        // ==================== 核心呼吸邏輯 ====================
        function processBreath(value) {
            const v = Math.min(100, Math.max(0, value));
            STATE.breathValue = v;
            meterFill.style.width = v + '%';
            breathValue.textContent = Math.round(v);

            if (STATE.isResting || STATE.isGrowing) return;

            // 記錄每次呼吸（取樣頻率不要太高，這裡每 5 次記錄一次）
            if (Math.random() < 0.1) { // 10% 採樣率
                logEvent('breath_sample', { 
                    value: Math.round(v),
                    threshold: STATE.threshold 
                });
            }

            if (v >= STATE.threshold && STATE.stage < STATE.maxStage) {
                STATE.stage = Math.min(STATE.stage + 1, STATE.maxStage);
                STATE.trainingCount += 1;
                updateTree();
                playGrowAnimation();

                if (STATE.stage >= STATE.maxStage) {
                    startRestPeriod();
                }
            } else if (v < STATE.threshold && v > 10) {
                if (Math.random() < 0.05) {
                    log('💨 再用力一點！ 目前 ' + Math.round(v) + ' / ' + STATE.threshold);
                }
            }
        }

        // ==================== 休息倒數 ====================
        function startRestPeriod() {
            if (STATE.isResting) return;
            STATE.isResting = true;
            restOverlay.classList.remove('hidden');
            let remain = STATE.restSeconds;
            restCountdown.textContent = remain;
            log('🧘 休息 ' + remain + ' 秒');

            // 記錄休息開始
            logEvent('rest_start', { duration: STATE.restSeconds });

            generatePetals();

            if (STATE.restTimer) clearInterval(STATE.restTimer);
            STATE.restTimer = setInterval(() => {
                remain -= 1;
                restCountdown.textContent = remain;
                if (remain <= 0) {
                    clearInterval(STATE.restTimer);
                    STATE.restTimer = null;
                    restOverlay.classList.add('hidden');
                    STATE.isResting = false;
                    log('🌬️ 休息結束，繼續呼吸！');
                    
                    // 記錄休息結束
                    logEvent('rest_end', {});
                }
            }, 1000);
        }

        function generatePetals() {
            const overlay = restOverlay;
            overlay.querySelectorAll('.petal-fall').forEach(el => el.remove());
            for (let i = 0; i < 12; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal-fall';
                petal.textContent = ['🌸','🍂','🌸','🌼','🌸'][Math.floor(Math.random()*5)];
                petal.style.left = (10 + Math.random() * 70) + '%';
                petal.style.animationDelay = (Math.random() * 6) + 's';
                petal.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
                overlay.appendChild(petal);
            }
        }

        // ==================== 存檔 ====================
        function saveToLocal() {
            try {
                const data = {
                    stage: STATE.stage,
                    trainingCount: STATE.trainingCount,
                    timestamp: Date.now(),
                };
                localStorage.setItem('breathTreeSave', JSON.stringify(data));
                
                // 記錄存檔事件
                logEvent('save', data);
            } catch (e) {
                console.warn('存檔失敗', e);
            }
        }

        function loadFromLocal() {
            try {
                const raw = localStorage.getItem('breathTreeSave');
                if (!raw) return false;
                const data = JSON.parse(raw);
                STATE.stage = Math.min(data.stage || 0, STATE.maxStage);
                STATE.trainingCount = data.trainingCount || 0;
                updateTree();
                log('📂 讀取存檔 階級=' + STATE.stage + ' 訓練=' + STATE.trainingCount);
                
                // 記錄載入事件
                logEvent('load', data);
                
                if (STATE.stage >= STATE.maxStage) {
                    startRestPeriod();
                }
                return true;
            } catch (e) {
                return false;
            }
        }

        // ==================== 硬體連線 (ESP32) ====================
        async function connectESP32() {
            if (STATE.serialConnected) {
                await disconnectESP32();
                return;
            }
            try {
                if (!('serial' in navigator)) {
                    alert('此瀏覽器不支援 Web Serial API，請使用 Chrome/Edge');
                    return;
                }
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                STATE.port = port;
                STATE.serialConnected = true;
                connectBtn.textContent = '🔌 斷開 ESP32';
                log('✅ ESP32 已連線');
                
                // 記錄連線事件
                logEvent('hardware_connected', { type: 'ESP32' });

                const reader = port.readable.getReader();
                STATE.reader = reader;
                readLoop(reader);
            } catch (err) {
                log('❌ 連線失敗: ' + err.message);
                logEvent('hardware_error', { error: err.message });
                alert('無法連線 ESP32\n' + err.message);
            }
        }

        async function disconnectESP32() {
            try {
                if (STATE.reader) {
                    await STATE.reader.cancel();
                    STATE.reader = null;
                }
                if (STATE.port) {
                    await STATE.port.close();
                    STATE.port = null;
                }
                STATE.serialConnected = false;
                connectBtn.textContent = '🔌 連線 ESP32';
                log('🔌 已斷開 ESP32');
                
                logEvent('hardware_disconnected', {});
            } catch (e) {
                console.warn(e);
            }
        }

        async function readLoop(reader) {
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const text = new TextDecoder().decode(value);
                    const nums = text.match(/\d+/g);
                    if (nums) {
                        const val = parseInt(nums[0], 10);
                        if (!isNaN(val)) {
                            processBreath(val);
                        }
                    }
                }
            } catch (e) {
                if (e.name !== 'AbortError' && e.name !== 'CancelError') {
                    log('⚠️ 讀取錯誤: ' + e.message);
                }
            } finally {
                STATE.serialConnected = false;
                connectBtn.textContent = '🔌 連線 ESP32';
                log('🔌 連線中斷');
            }
        }

        // ==================== 鍵盤模擬 ====================
        function handleKeyDown(e) {
            if (e.key === 'ArrowDown' || e.key === 'Down') {
                e.preventDefault();
                if (!STATE.keyPressed) {
                    STATE.keyPressed = true;
                    STATE.keyStartTime = Date.now();
                }
                const elapsed = (Date.now() - STATE.keyStartTime) / 1000;
                const val = Math.min(100, 20 + elapsed * 40);
                processBreath(val);
            }
        }
        function handleKeyUp(e) {
            if (e.key === 'ArrowDown' || e.key === 'Down') {
                e.preventDefault();
                STATE.keyPressed = false;
                processBreath(0);
            }
        }

        // ==================== 重置 ====================
        function resetTree() {
            if (STATE.isResting) {
                clearInterval(STATE.restTimer);
                STATE.restTimer = null;
                restOverlay.classList.add('hidden');
                STATE.isResting = false;
            }
            
            // 記錄重置事件
            logEvent('reset', { 
                previousStage: STATE.stage,
                previousTraining: STATE.trainingCount 
            });
            
            STATE.stage = 0;
            STATE.trainingCount = 0;
            updateTree();
            treeSvg.classList.remove('grow-glow', 'bloom');
            flowerGroup.setAttribute('opacity', '0');
            log('🌱 樹已重置，重新開始');
            saveToLocal();
        }

        // ==================== 初始化 ====================
        function init() {
            const hasSave = loadFromLocal();
            if (!hasSave) {
                updateTree();
                // 記錄初始狀態
                logEvent('init', {});
            }
            
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            connectBtn.addEventListener('click', connectESP32);
            resetTreeBtn.addEventListener('click', resetTree);
            
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' || e.key === 'Down') e.preventDefault();
            }, { passive: false });

            log('🌳 呼吸養樹已啟動！ 按住 ↓ 或接上 ESP32');
            
            // 定期上傳心跳（每 30 秒）
            setInterval(() => {
                logEvent('heartbeat', {
                    stage: STATE.stage,
                    trainingCount: STATE.trainingCount,
                    isResting: STATE.isResting,
                });
            }, 30000);
        }

        init();
    })();
</script>
</body>
</html>
